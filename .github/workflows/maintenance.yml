# Scheduled maintenance for the hosted app (free alternative to paid cron jobs).
# Repository secrets needed: DATABASE_URL, ML_SERVICE_URL, ML_SERVICE_TOKEN.
name: maintenance

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST daily
  workflow_dispatch: {}

jobs:
  purge-events:
    runs-on: ubuntu-latest
    if: ${{ vars.MAINTENANCE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=dev
        working-directory: server
      - name: Delete events and sessions past the retention window
        run: npm run purge-events
        working-directory: server
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: not-used-by-this-script-but-required-by-config

  retrain:
    runs-on: ubuntu-latest
    if: ${{ vars.MAINTENANCE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Retrain the recommender inside the ML service
        # The free instance may be asleep: the first call wakes it, retries cover the cold start.
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 600 -X POST \
              -H "X-Service-Token: ${{ secrets.ML_SERVICE_TOKEN }}" "${{ secrets.ML_SERVICE_URL }}/v1/model/retrain")
            echo "attempt $i: HTTP $code"; cat out.json; echo
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          exit 1
