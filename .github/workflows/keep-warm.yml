# Keeps the free Render storefront awake during Indian daytime so visitors don't wait ~50 s for a cold start.
# Render's 750 free instance-hours a month are shared by both services, so pings run only 02:00-18:59 UTC
# (07:30-00:29 IST, ~530 h/month), leaving ~220 h for the ML service, which wakes on demand. The storefront
# falls back to popularity while the ML service is asleep, so that doesn't slow pages down.
# Set the repository variable KEEP_WARM=false to pause it, or STORE_URL to point it elsewhere.
name: keep-warm

on:
  schedule:
    - cron: '*/10 2-18 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEP_WARM != 'false' }}
    timeout-minutes: 3
    steps:
      - name: Ping the storefront health check
        run: |
          url="${{ vars.STORE_URL || 'https://anvaya-store.onrender.com' }}/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url") || code=000
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Storefront did not answer 200 (suspended or deploying?)"
