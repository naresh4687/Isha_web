# Manual product-image sync against the production database (never runs on deploy or on a schedule).
# Dry run (default) validates the manifest and reports what would change; "apply" writes the changes.
# Every run uploads the inventory report as an artifact, which is the audit trail. No images are fetched
# from the network here: new photos are prepared with tools/product-images and reviewed in a pull request.
# Needs the DATABASE_URL secret (production environment or repository).
name: image-sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports only; apply updates product images'
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: image-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=dev
      - name: Image sync (${{ inputs.mode }}) by ${{ github.actor }}
        run: npm run images:sync -- ${{ inputs.mode == 'apply' && '--apply' || '' }} --report=image-inventory.md
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: not-used-by-this-script-but-required-by-config
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: image-inventory-${{ inputs.mode }}-${{ github.run_number }}
          path: server/image-inventory.md
          if-no-files-found: ignore
          retention-days: 90
