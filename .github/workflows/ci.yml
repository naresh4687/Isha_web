# Continuous integration: typecheck, unit tests, build and end-to-end tests on every push and PR.
# Versions match render.yaml (Node 20, Python 3.12). Postgres runs as a throwaway service container.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anvaya
          POSTGRES_PASSWORD: anvaya_dev_password
          POSTGRES_DB: anvaya_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U anvaya" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck and production build
        run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    env:
      # server/.env is not committed; the e2e API still needs a (throwaway) signing secret.
      JWT_SECRET: ci-e2e-only-secret-not-used-anywhere-else
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anvaya
          POSTGRES_PASSWORD: anvaya_dev_password
          POSTGRES_DB: anvaya
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U anvaya" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
