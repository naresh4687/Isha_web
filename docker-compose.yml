services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anvaya
      POSTGRES_PASSWORD: anvaya_dev_password
      POSTGRES_DB: anvaya
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvaya"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
